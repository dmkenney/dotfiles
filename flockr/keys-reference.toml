# Keybind reference for flockr.
# Part 1: your old custom [keys] section, removed from config.toml on 2026-10-18.
# Copy any line back under [keys] in config.toml, then run: flockr server reload-config

[keys]
# Mirrors ~/dotfiles/tmux/.tmux.conf (plus tmux defaults it relies on)
# tmux session -> herdr workspace, tmux window -> herdr tab, tmux pane -> herdr pane
prefix = "ctrl+space"

# Config and help (bind r source-file)
reload_config = "prefix+r"
help = "prefix+?"
detach = "prefix+d"
settings = "prefix+shift+s"

# Copy mode (vi keys inside copy mode are built in, not configurable)
copy_mode = "prefix+["

# Panes: " stacks, % puts side by side
split_horizontal = ['prefix+"', "prefix+minus", "alt+shift+enter"]
split_vertical = ["prefix+%", "prefix+v", "alt+enter"]
close_pane = ["prefix+x", "alt+esc"]
zoom = "prefix+z"
last_pane = "prefix+;"
cycle_pane_next = "prefix+o"

# bind h/j/k/l select-pane, plus vim-tmux-navigator's C-h/j/k/l
focus_pane_left = ["prefix+h", "ctrl+h", "ctrl+alt+left", "ctrl+alt+h"]
focus_pane_down = ["ctrl+j", "ctrl+alt+down", "ctrl+alt+j"]
focus_pane_up = ["ctrl+k", "ctrl+alt+up", "ctrl+alt+k"]
focus_pane_right = ["prefix+l", "ctrl+l", "ctrl+alt+right", "ctrl+alt+l"]

# bind C-h/j/k/l resize-pane
resize_pane_left = ["prefix+ctrl+h", "ctrl+alt+shift+left", "ctrl+alt+shift+h"]
resize_pane_down = ["prefix+ctrl+j", "ctrl+alt+shift+down", "ctrl+alt+shift+j"]
resize_pane_up = ["prefix+ctrl+k", "ctrl+alt+shift+up", "ctrl+alt+shift+k"]
resize_pane_right = ["prefix+ctrl+l", "ctrl+alt+shift+right", "ctrl+alt+shift+l"]
resize_mode = ["prefix+ctrl+left", "prefix+ctrl+down", "prefix+ctrl+up", "prefix+ctrl+right"]

rename_pane = "prefix+shift+o"

# Windows -> tabs
new_tab = "prefix+c"
rename_tab = "prefix+comma"
close_tab = "prefix+ampersand"
switch_tab = "prefix+1..9"
previous_tab = ["prefix+p", "alt+left"]
next_tab = ["prefix+n", "alt+right"]
move_tab_previous = "alt+shift+left"
move_tab_next = "alt+shift+right"

# Sessions -> workspaces
workspace_picker = ["prefix+j", "prefix+k", "prefix+s", "prefix+w"]
new_workspace = "prefix+shift+c"
rename_workspace = ["prefix+$", "prefix+shift+r"]
close_workspace = "prefix+shift+k"
switch_workspace = "ctrl+alt+1..9"
previous_workspace = ["prefix+shift+p", "alt+up"]
next_workspace = ["prefix+shift+n", "alt+down"]

# Workspace picker: prefix+j, then j/k to move, enter to open
navigate_workspace_up = ["k", "up"]
navigate_workspace_down = ["j", "down"]
navigate_pane_up = "shift+k"
navigate_pane_down = "shift+j"

# Step through agents in sidebar order
next_agent = "alt+j"
previous_agent = "alt+k"
focus_agent = "alt+1..9"


# Part 2: flockr defaults (from: flockr --default-config). These apply when [keys] is unset.

# [keys]
# Prefix key to enter prefix mode (default: "ctrl+b")
# Examples: "ctrl+b", "f12", "esc", "-"
# Action bindings use explicit syntax: "prefix+n" requires the prefix;
# "ctrl+alt+n" is a direct terminal-mode shortcut.
# Accepted key syntax: plain keys, ctrl/shift/alt/cmd/super modifiers, and special keys like enter/tab/esc/left/right/up/down.
# Named punctuation such as minus, comma, ampersand, plus, and backtick is also accepted.
# Most reliable direct bindings are ctrl+letter, function keys, and explicit modified chords.
# alt+..., cmd/super, and punctuation-with-modifiers may depend on your terminal/tmux setup.
# prefix = "ctrl+b"

# Prefix-mode actions
# help = "prefix+?"
# settings = "prefix+s"
# detach = "prefix+q"
# reload_config = "prefix+shift+r"
# open_notification_target = "prefix+o"
# workspace_picker = "prefix+w"
# goto = "prefix+g"
# new_workspace = "prefix+shift+n"
# new_worktree = "prefix+shift+g"
# open_worktree = ""    # optional, unset by default
# remove_worktree = ""  # optional, unset by default; opens confirmation
# rename_workspace = "prefix+shift+w"
# close_workspace = "prefix+shift+d"
# previous_workspace = "" # optional, unset by default
# next_workspace = ""     # optional, unset by default
# previous_agent = ""     # optional, unset by default
# next_agent = ""         # optional, unset by default
# focus_agent = ""        # optional indexed binding, e.g. "prefix+alt+1..9"
# remote_image_paste = "ctrl+v" # only active in flockr --remote; empty disables raw-key image paste
# new_tab = "prefix+c"
# rename_tab = "prefix+shift+t"
# previous_tab = "prefix+p"
# next_tab = "prefix+n"
# move_tab_previous = ""   # optional, e.g. "alt+shift+left" moves the tab toward the front
# move_tab_next = ""       # optional, e.g. "alt+shift+right" moves the tab toward the back
# switch_tab = "prefix+1..9"
# switch_workspace = ""   # optional indexed binding, e.g. "prefix+shift+1..9"
# close_tab = "prefix+shift+x"
# rename_pane = "prefix+shift+p"
# edit_scrollback = "prefix+e"
# clear_pane = ""                  # unbound; e.g. "prefix+ctrl+k"
# focus_pane_left = "prefix+h"
# focus_pane_down = "prefix+j"
# focus_pane_up = "prefix+k"
# focus_pane_right = "prefix+l"
# cycle_pane_next = "prefix+tab"
# cycle_pane_previous = "prefix+shift+tab"
# last_pane = ""          # optional, unset by default; bind e.g. "prefix+tab" for global back-and-forth
# split_vertical = "prefix+v"
# split_horizontal = "prefix+minus"
# close_pane = "prefix+x"
# zoom = "prefix+z"       # legacy alias: fullscreen
# resize_mode = "prefix+r"
# resize_pane_left = ""   # optional, e.g. "ctrl+shift+alt+left" resizes without entering resize mode
# resize_pane_down = ""   # optional, e.g. "ctrl+shift+alt+down"
# resize_pane_up = ""     # optional, e.g. "ctrl+shift+alt+up"
# resize_pane_right = ""  # optional, e.g. "ctrl+shift+alt+right"
# toggle_sidebar = "prefix+b"

# Navigate-mode movement. These local shortcuts win while navigate mode is open.
# They are independent from focus_pane_*. Do not include prefix+, esc, enter, tab, or 1..9 here.
# navigate_workspace_up = "up"
# navigate_workspace_down = "down"
# navigate_pane_left = "h"      # left arrow always focuses the pane to the left
# navigate_pane_down = "j"
# navigate_pane_up = "k"
# navigate_pane_right = "l"     # right arrow always focuses the pane to the right

# Custom commands use the same binding syntax.
# type = "shell" runs detached in the background.
# type = "pane" opens a temporary pane and closes it when the command exits.
# type = "popup" opens a session-modal terminal without changing the tab layout.
# Popup width and height accept terminal cells or percentages such as "80%".
# On Windows, command strings run through cmd.exe /d /c.
# [[keys.command]]
# key = "prefix+alt+g"
# type = "popup"
# command = "lazygit"
# width = "80%"
# height = "80%"

# Legacy indexed shortcut config is still parsed for compatibility.
# Prefer switch_tab, switch_workspace, and focus_agent for new configs.
# [keys.indexed]
# tabs = ""       # e.g. "ctrl" makes ctrl+1..9 switch tabs directly
# workspaces = "" # e.g. "ctrl+shift" makes ctrl+shift+1..9 switch workspaces directly
# agents = ""     # e.g. "alt" makes alt+1..9 focus agent rows directly

# Size of the virtual terminal used when no client is attached.
# Attached clients always use their own terminal size.
