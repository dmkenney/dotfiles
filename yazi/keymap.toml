# Enter goes into folders and opens files (stock Enter opens folders in $EDITOR).
[[mgr.prepend_keymap]]
on   = "<Enter>"
run  = "plugin smart-enter"
desc = "Enter folder or open file"

# Disk list: mount/unmount/eject, l to enter mount point.
[[mgr.prepend_keymap]]
on   = "M"
run  = "plugin mount"
desc = "Mount manager"

[[mgr.prepend_keymap]]
on   = ["g", "m"]
run  = "cd /run/media/dylan"
desc = "Go to USB drives"
