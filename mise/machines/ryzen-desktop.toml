# New desktop: Ryzen 9 9950X, RTX 5070 Ti, Gigabyte B850 AORUS ELITE WIFI7 ICE. Omarchy.
# host: dk-desktop
# RTX 50 series (Blackwell) only works with NVIDIA's open kernel modules.
# Omarchy installs nvidia-open-dkms and nvidia-utils itself (install/hardware/nvidia.sh).

[bootstrap.packages]
"pacman:amd-ucode" = "latest"
"pacman:nvidia-settings" = "latest"
# RGB on the coolers and RAM
"pacman:openrgb" = "latest"
# MX Vertical top button: hold to dictate, double tap for Enter (solaar/rules.yaml).
# One-time, with the mouse connected: solaar config "MX Vertical" divert-keys "DPI Switch" Diverted
"pacman:solaar" = "latest"

[dotfiles]
"~/.config/hypr/monitors.lua" = "~/dotfiles/omarchy/hypr/monitors/ryzen-desktop.lua"
"~/.config/hypr/autostart.lua" = "~/dotfiles/omarchy/hypr/autostart/ryzen-desktop.lua"
"~/.config/solaar/rules.yaml" = "~/dotfiles/solaar/rules.yaml"
"~/.local/bin/mouse-dictate" = "~/dotfiles/bin/mouse-dictate"
# Key Light Air over USB: bar widget, developed in ~/Projects/omarchy-keylight-usb.
"~/.config/omarchy/plugins/io.github.dmkenney.keylight-usb" = "~/Projects/omarchy-keylight-usb"
# OpenRGB profiles: rainbow is loaded at login by openrgb-server.service; desk-lights switches
# to off and back when hypridle turns the monitors off and on.
# In personal: the profiles record hardware serials.
"~/.config/OpenRGB/profiles/rainbow.json" = "~/dotfiles/personal/openrgb/ryzen-desktop/rainbow.json"
"~/.config/OpenRGB/profiles/off.json" = "~/dotfiles/personal/openrgb/ryzen-desktop/off.json"
"~/.local/bin/desk-lights" = "~/dotfiles/bin/desk-lights"
"~/.config/systemd/user/openrgb-server.service" = "~/dotfiles/systemd/user/openrgb-server.service"

# The AMD SMBus driver (RAM RGB) fails on an ACPI resource conflict without this.
[bootstrap.hooks.post-packages]
run = [
  "grep -q acpi_enforce_resources=lax /etc/default/limine || { sudo sed -i '0,/^KERNEL_CMDLINE\\[default\\]+=\"/s//&acpi_enforce_resources=lax /' /etc/default/limine && sudo limine-update; }",
]

[bootstrap.hooks.post-dotfiles]
run = [
  "systemctl --user daemon-reload && systemctl --user enable --now openrgb-server.service",
]

[bootstrap.repos]
"~/Projects/omarchy-keylight-usb" = { url = "git@github.com:dmkenney/omarchy-keylight-usb.git" }
