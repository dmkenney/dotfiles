# Laptop. Omarchy.
# host: (set to the laptop's hostname so omarchy/setup.sh finds this file)
# Omarchy installs CPU microcode and GPU drivers itself; add hardware-specific
# packages here only if Omarchy misses something.
# No monitor layout: Omarchy's default monitors.lua (auto scale) suits a laptop panel.

[bootstrap.packages]
"aur:netbird-bin" = "latest"
