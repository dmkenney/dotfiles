# Machine setup for Arch (Omarchy or i3). Replaces install.sh.
#
# ~/.config/mise/config.toml links here. Per-machine and private config load from
# ~/.config/mise/conf.d/ (see README):
#   machine.toml  -> mise/machines/<host>.toml   (drivers, microcode, hardware)
#   desktop.toml  -> mise/desktops/<i3|omarchy>.toml (window manager, X11/Wayland tools, bootloader)
#   personal.toml -> personal/mise.toml          (ssh, git, aws, sshd)
#
#   mise bootstrap --dry-run   # preview
#   mise bootstrap             # apply
#   mise bootstrap status      # check this machine against the config

[tools]
erlang = "27.3"
elixir = "1.18.3-otp-27"
python = "3.11"
ruby = "3.4.2"
uv = "0.8.0"
git-lfs = "latest"
# Global default; projects that need another version pin it in their own mise.toml.
node = "26"
"npm:@googleworkspace/cli" = "latest"
"npm:agent-browser" = "latest"
"npm:ccusage" = "latest"
"npm:chromedriver" = "latest"
"npm:eas-cli" = "latest"
"npm:playwright-mcp" = "latest"
"npm:wrangler" = "latest"
# ansible-core has the commands; the ansible package adds the collections
# (ansible.posix, community.general) the infrastructure playbooks use.
# 2.18 because mise installs it under the global python (3.11) and 2.20+
# needs 3.12; 2.18 is also what the infrastructure playbooks were run with.
"pipx:ansible-core" = { version = "2.18", uvx_args = "--with ansible" }
stripe = "latest"
powershell = "latest"
flyctl = "latest"

[settings]
experimental = true
# Dotfiles live in this git repo; don't keep a second history of them.
history.enabled = false
# `mise use -g` (by hand, or by Omarchy's tool launchers) writes to this untracked,
# per-machine file instead of this shared one. Add tools for every machine here.
write_targets.tools = "~/.config/mise/conf.d/local-tools.toml"

[settings.upgrade]
auto_prune = false

# --- System packages --------------------------------------------------------
# Hardware-specific packages (GPU driver, CPU microcode) go in mise/machines/.
# Desktop-specific packages (i3/X11 or Omarchy) go in mise/desktops/.
# Packages, tools and services Omarchy already installs are declared only in
# mise/desktops/i3.toml.
# Arch: keep upgrading with `sudo pacman -Syu`, not `mise bootstrap packages upgrade`.
[bootstrap.packages]
"pacman:7zip" = "latest"
"pacman:aarch64-linux-gnu-gcc" = "latest"
"pacman:aws-cli-v2" = "latest"
"pacman:bind" = "latest"
"pacman:caddy" = "latest"
"pacman:cloudflared" = "latest"
"pacman:cups-pdf" = "latest"
"pacman:dbeaver" = "latest"
"pacman:direnv" = "latest"
"pacman:dive" = "latest"
"pacman:dmidecode" = "latest"
"pacman:ethtool" = "latest"
"pacman:fop" = "latest"
"pacman:fuse2" = "latest"
"pacman:fwupd" = "latest"
"pacman:gdb" = "latest"
"pacman:gimp" = "latest"
"pacman:git-filter-repo" = "latest"
"pacman:glab" = "latest"
"pacman:hcloud" = "latest"
"pacman:htop" = "latest"
"pacman:img2pdf" = "latest"
"pacman:inkscape" = "latest"
"pacman:jpegoptim" = "latest"
"pacman:lksctp-tools" = "latest"
"pacman:lshw" = "latest"
"pacman:lsof" = "latest"
"pacman:mesa-utils" = "latest"
"pacman:nano" = "latest"
"pacman:nmap" = "latest"
"pacman:nvtop" = "latest"
# personal/mise.toml manages /etc/ssh/sshd_config, which needs openssh and the sshd
# service on every machine. On Omarchy, setup.sh also runs omarchy-setup-security-sshd
# for the ufw rule and an authorized key.
"pacman:openssh" = "latest"
"pacman:openscenegraph" = "latest"
"pacman:optipng" = "latest"
"pacman:oxipng" = "latest"
"pacman:pandoc-cli" = "latest"
"pacman:pgvector" = "latest"
"pacman:playerctl" = "latest"
"pacman:podofo" = "latest"
"pacman:postgis" = "latest"
"pacman:postgresql" = "latest"
"pacman:proton-vpn-cli" = "latest"
"pacman:python" = "latest"
"pacman:python-build" = "latest"
"pacman:python-pip" = "latest"
"pacman:python-setuptools" = "latest"
"pacman:raylib" = "latest"
"pacman:rpi-imager" = "latest"
"pacman:rsync" = "latest"
"pacman:sane-airscan" = "latest"
"pacman:scribus" = "latest"
"pacman:smartmontools" = "latest"
# Syncs ~/.claude/projects and tmux-resurrect saves over NetBird (bin/syncthing-setup).
"pacman:syncthing" = "latest"
"pacman:tk" = "latest"
"pacman:tokei" = "latest"
"pacman:udisks2" = "latest"
"pacman:unixodbc" = "latest"
"pacman:unpaper" = "latest"
"pacman:vim" = "latest"
"pacman:vlc" = "latest"
"pacman:vlc-plugin-ffmpeg" = "latest"
"pacman:wget" = "latest"
"pacman:wireshark-qt" = "latest"
"pacman:xdg-utils" = "latest"
"pacman:xpdf" = "latest"
"pacman:yazi" = "latest"
"pacman:zip" = "latest"
"aur:ast-grep-bin" = "latest"
"aur:flarectl-bin" = "latest"
"aur:lazysql" = "latest"
"aur:pg_textsearch" = "latest"
"aur:scc" = "latest"
"aur:ttf-ms-fonts" = "latest"
"aur:ttf-vista-fonts" = "latest"

# --- Accounts -----------------------------------------------------------------
# No docker group: it equals passwordless root, and Omarchy leaves it out on purpose
# (opt in with omarchy-setup-security-sudoless-docker). i3 machines add it.
[bootstrap.users.dylan]
group = "dylan"
groups = ["wheel"]

# --- Git checkouts ------------------------------------------------------------
# tpm installs the other tmux plugins listed in .tmux.conf (post-dotfiles hook).
[bootstrap.repos]
"~/.tmux/plugins/tpm" = { url = "https://github.com/tmux-plugins/tpm" }

# --- Dotfiles (symlinks into this repo) --------------------------------------
[dotfiles]
"~/.config/mise/config.toml" = "~/dotfiles/mise/config.toml"
"~/.config/nvim" = "~/dotfiles/nvim"
"~/.config/mise/conf.d/personal.toml" = "~/dotfiles/personal/mise.toml"
# Scripts
"~/.local/bin/brave-sessions" = "~/dotfiles/bin/brave-sessions"
"~/.local/bin/obsbot-enforce" = "~/dotfiles/bin/obsbot-enforce"
"~/.local/bin/claude-settings-env" = "~/dotfiles/bin/claude-settings-env"
"~/.local/bin/syncthing-setup" = "~/dotfiles/bin/syncthing-setup"
"~/.local/bin/copy-from-old-machine" = "~/dotfiles/bin/copy-from-old-machine"
"~/.local/bin/theme-review" = "~/dotfiles/bin/theme-review"
# User systemd units (enabled in the post-dotfiles hook)
"~/.config/systemd/user/brave-sessions.service" = "~/dotfiles/systemd/user/brave-sessions.service"
"~/.config/systemd/user/brave-sessions.timer" = "~/dotfiles/systemd/user/brave-sessions.timer"
"~/.config/systemd/user/obsbot-enforce.service" = "~/dotfiles/systemd/user/obsbot-enforce.service"
# Global agent instructions: one source, linked per tool
"~/.claude/CLAUDE.md" = "~/dotfiles/AGENTS.md"
"~/.codex/AGENTS.md" = "~/dotfiles/AGENTS.md"
"~/.gemini/GEMINI.md" = "~/dotfiles/AGENTS.md"
"~/.config/opencode/AGENTS.md" = "~/dotfiles/AGENTS.md"
# opencode: local models through Ollama (localhost:11434), 64k context to match num_ctx
"~/.config/opencode/opencode.json" = "~/dotfiles/opencode/opencode.json"
# herdr (installed per desktop). The Omarchy theme hook rewrites sidebar_bg.
"~/.config/herdr/config.toml" = "~/dotfiles/herdr/config.toml"
# flockr, the herdr fork built from ~/Projects/flockr. The theme hook rewrites its accent.
"~/.config/flockr/config.toml" = "~/dotfiles/flockr/config.toml"

# --- System services ----------------------------------------------------------
[bootstrap.services.postgresql]
[bootstrap.services.sshd]
[bootstrap.services.lm_sensors]

# --- Hooks (commands mise can't declare) ---------------------------------------
[bootstrap.hooks.post-dotfiles]
run = [
  "systemctl --user daemon-reload && systemctl --user enable --now brave-sessions.timer obsbot-enforce.service",
  # Starts syncthing.service and adds the peers in personal/syncthing/devices.
  "~/dotfiles/bin/syncthing-setup",
  # Install the tmux plugins listed in the tmux config. Runs after dotfiles so the
  # config is linked. tpm reads its settings from the tmux server, so reload the
  # config into a server that is already running.
  "tmux has-session 2>/dev/null && tmux source-file -q ~/.tmux.conf \\; source-file -q ~/.config/tmux/tmux.conf; ~/.tmux/plugins/tpm/bin/install_plugins",
  # Sidebar numbers for alt+1..9 (herdr/agent-numbers). Linking again is a no-op.
  "! command -v herdr >/dev/null || herdr plugin link ~/dotfiles/herdr/agent-numbers >/dev/null",
]

[bootstrap.hooks.post-packages]
run = [
  # postgresql won't start until its data directory is initialized.
  "sudo test -e /var/lib/postgres/data/PG_VERSION || sudo -iu postgres initdb -D /var/lib/postgres/data",
  # pg_textsearch only loads from shared_preload_libraries. Restart only if this added it.
  "sudo grep -q pg_textsearch /var/lib/postgres/data/postgresql.auto.conf || { echo \"shared_preload_libraries = 'pg_textsearch'\" | sudo -u postgres tee -a /var/lib/postgres/data/postgresql.auto.conf >/dev/null && sudo systemctl try-restart postgresql; }",
]

[bootstrap.hooks.post-tools]
run = [
  "npx -y skills add coreyhaines31/marketingskills --global --all -y",
  "npx -y skills add mager/frontend-design --global --all -y",
  "npx -y skills add JuliusBrussee/caveman --global --all -y",
]
