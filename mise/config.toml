# Machine setup for Arch + i3. Replaces install.sh.
#
# ~/.config/mise/config.toml links here. Per-machine and private config load from
# ~/.config/mise/conf.d/ (see README):
#   machine.toml  -> mise/machines/<host>.toml   (drivers, microcode, hardware)
#   personal.toml -> personal/mise.toml          (ssh, git, aws, firewall, sshd)
#
#   mise bootstrap --dry-run   # preview
#   mise bootstrap             # apply
#   mise bootstrap status      # check this machine against the config

[tools]
erlang = "27.3"
elixir = "1.18.3-otp-27"
python = "3.11.9"
ruby = "3.4.2"
uv = "0.8.0"
git-lfs = "latest"
"npm:@google/gemini-cli" = "latest"
"npm:@googleworkspace/cli" = "latest"
"npm:@openai/codex" = "latest"
"npm:@playwright/test" = "latest"
"npm:agent-browser" = "latest"
"npm:ccusage" = "latest"
"npm:cf" = "latest"
"npm:chromedriver" = "latest"
"npm:eas-cli" = "latest"
"npm:opencode-ai" = "latest"
"npm:playwright-mcp" = "latest"
"npm:wrangler" = "latest"
"pipx:harlequin" = "latest"
stripe = "latest"
herdr = "latest"
powershell = "latest"
flyctl = "latest"

[settings]
experimental = true
# Dotfiles live in this git repo; don't keep a second history of them.
history.enabled = false

# --- System packages --------------------------------------------------------
# Hardware-specific packages (GPU driver, CPU microcode) go in mise/machines/.
