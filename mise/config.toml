# --- Accounts -----------------------------------------------------------------
[bootstrap.users.dylan]
group = "dylan"
groups = ["wheel", "docker"]

# --- Git checkouts ------------------------------------------------------------
# tpm installs the other tmux plugins listed in .tmux.conf (post-dotfiles hook).
[bootstrap.repos]
"~/.tmux/plugins/tpm" = { url = "https://github.com/tmux-plugins/tpm" }

# --- Dotfiles (symlinks into this repo) --------------------------------------
[dotfiles]
"~/.config/mise/config.toml" = "~/dotfiles/mise/config.toml"
"~/.config/nvim" = "~/dotfiles/nvim"
"~/.config/mise/conf.d/personal.toml" = "~/dotfiles/personal/mise.toml"
# Scripts
"~/.local/bin/brave-sessions" = "~/dotfiles/bin/brave-sessions"
"~/.local/bin/obsbot-enforce" = "~/dotfiles/bin/obsbot-enforce"
"~/.local/bin/claude-settings-env" = "~/dotfiles/bin/claude-settings-env"
# User systemd units (enabled in the post-dotfiles hook)
"~/.config/systemd/user/brave-sessions.service" = "~/dotfiles/systemd/user/brave-sessions.service"
"~/.config/systemd/user/brave-sessions.timer" = "~/dotfiles/systemd/user/brave-sessions.timer"
"~/.config/systemd/user/obsbot-enforce.service" = "~/dotfiles/systemd/user/obsbot-enforce.service"
# Global agent instructions: one source, linked per tool
"~/.claude/CLAUDE.md" = "~/dotfiles/AGENTS.md"
"~/.codex/AGENTS.md" = "~/dotfiles/AGENTS.md"
"~/.gemini/GEMINI.md" = "~/dotfiles/AGENTS.md"
"~/.config/opencode/AGENTS.md" = "~/dotfiles/AGENTS.md"

# --- System services ----------------------------------------------------------
[bootstrap.services.NetworkManager]
[bootstrap.services.docker]
[bootstrap.services.postgresql]
[bootstrap.services.cups]
[bootstrap.services.tailscaled]
[bootstrap.services.sshd]
[bootstrap.services.lm_sensors]
# Weekly package cache cleanup
[bootstrap.services."paccache.timer"]

# --- Hooks (commands mise can't declare) ---------------------------------------
[bootstrap.hooks.post-dotfiles]
run = [
  "systemctl --user daemon-reload && systemctl --user enable --now brave-sessions.timer obsbot-enforce.service",
  # Install the tmux plugins listed in the tmux config. Runs after dotfiles so the
  # config is linked. tpm reads its settings from the tmux server, so reload the
  # config into a server that is already running.
  "tmux has-session 2>/dev/null && tmux source-file -q ~/.tmux.conf \\; source-file -q ~/.config/tmux/tmux.conf; ~/.tmux/plugins/tpm/bin/install_plugins",
]

[bootstrap.hooks.post-packages]
run = [
  # postgresql won't start until its data directory is initialized.
  "sudo test -e /var/lib/postgres/data/PG_VERSION || sudo -iu postgres initdb -D /var/lib/postgres/data",
]

[bootstrap.hooks.post-tools]
run = [
  "npx -y skills add coreyhaines31/marketingskills --global --all -y",
  "npx -y skills add mager/frontend-design --global --all -y",
  "npx -y skills add JuliusBrussee/caveman --global --all -y",
]
