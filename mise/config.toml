# Machine setup for Arch + i3. Replaces install.sh.
#
# ~/.config/mise/config.toml links here. Per-machine and private config load from
# ~/.config/mise/conf.d/ (see README):
#   machine.toml  -> mise/machines/<host>.toml   (drivers, microcode, hardware)
#   desktop.toml  -> mise/desktops/<i3|omarchy>.toml (window manager, X11/Wayland tools, bootloader)
#   personal.toml -> personal/mise.toml          (ssh, git, aws, sshd)
#
#   mise bootstrap --dry-run   # preview
#   mise bootstrap             # apply
#   mise bootstrap status      # check this machine against the config

[tools]
erlang = "27.3"
elixir = "1.18.3-otp-27"
python = "3.11"
ruby = "3.4.2"
uv = "0.8.0"
git-lfs = "latest"
# Global default; projects that need another version pin it in their own mise.toml.
node = "26"
gemini = "latest"
"npm:@googleworkspace/cli" = "latest"
codex = "latest"
"npm:@playwright/test" = "latest"
"npm:agent-browser" = "latest"
"npm:ccusage" = "latest"
"npm:cf" = "latest"
"npm:chromedriver" = "latest"
"npm:eas-cli" = "latest"
opencode = "latest"
"npm:playwright-mcp" = "latest"
"npm:wrangler" = "latest"
"pipx:harlequin" = "latest"
stripe = "latest"
herdr = "latest"
powershell = "latest"
flyctl = "latest"

[settings]
experimental = true
# Dotfiles live in this git repo; don't keep a second history of them.
history.enabled = false
# `mise use -g` (by hand, or by Omarchy's tool launchers) writes to this untracked,
# per-machine file instead of this shared one. Add tools for every machine here.
write_targets.tools = "~/.config/mise/conf.d/local-tools.toml"

# --- System packages --------------------------------------------------------
# Hardware-specific packages (GPU driver, CPU microcode) go in mise/machines/.
# Desktop-specific packages (i3/X11 or Omarchy) go in mise/desktops/.
