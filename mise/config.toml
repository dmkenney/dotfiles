# --- Accounts -----------------------------------------------------------------
[bootstrap.users.dylan]
group = "dylan"
groups = ["wheel", "docker"]

# --- Git checkouts ------------------------------------------------------------
# tpm installs the other tmux plugins listed in .tmux.conf (post-repos hook).
[bootstrap.repos]
"~/.tmux/plugins/tpm" = { url = "https://github.com/tmux-plugins/tpm" }

# --- Dotfiles (symlinks into this repo) --------------------------------------
[dotfiles]
"~/.config/mise/config.toml" = "~/dotfiles/mise/config.toml"
"~/.zshrc" = "~/dotfiles/zsh/.zshrc"
"~/.p10k.zsh" = "~/dotfiles/zsh/.p10k.zsh"
"~/.tmux.conf" = "~/dotfiles/tmux/.tmux.conf"
"~/.gtkrc-2.0" = "~/dotfiles/gtk/.gtkrc-2.0"
"~/.Xmodmap" = "~/dotfiles/i3/.Xmodmap"
"~/.config/alacritty" = "~/dotfiles/alacritty"
"~/.config/nvim" = "~/dotfiles/nvim"
"~/.config/backgrounds" = "~/dotfiles/backgrounds"
"~/.config/picom.conf" = "~/dotfiles/picom/picom.conf"
"~/.config/i3/config" = "~/dotfiles/i3/config"
"~/.config/i3/dropdown.sh" = "~/dotfiles/i3/dropdown.sh"
"~/.config/i3status/config" = "~/dotfiles/i3status/config"
"~/.config/dunst/dunstrc" = "~/dotfiles/dunst/dunstrc"
"~/.config/flameshot/flameshot.ini" = "~/dotfiles/flameshot/flameshot.ini"
"~/.config/ghostty/config" = "~/dotfiles/ghostty/config"
"~/.config/lazygit/config.yml" = "~/dotfiles/lazygit/config.yml"
"~/.config/btop/btop.conf" = "~/dotfiles/btop/btop.conf"
"~/.config/mise/conf.d/personal.toml" = "~/dotfiles/personal/mise.toml"
# Scripts
"~/.local/bin/clipguard" = "~/dotfiles/bin/clipguard"
"~/.local/bin/brave-unwedge" = "~/dotfiles/bin/brave-unwedge"
"~/.local/bin/brave-sessions" = "~/dotfiles/bin/brave-sessions"
"~/.local/bin/obsbot-enforce" = "~/dotfiles/bin/obsbot-enforce"
"~/.local/bin/claude-settings-env" = "~/dotfiles/bin/claude-settings-env"
"~/.local/bin/setup-snapper" = "~/dotfiles/bin/setup-snapper"
# User systemd units (enabled in the post-dotfiles hook)
"~/.config/systemd/user/brave-sessions.service" = "~/dotfiles/systemd/user/brave-sessions.service"
"~/.config/systemd/user/brave-sessions.timer" = "~/dotfiles/systemd/user/brave-sessions.timer"
"~/.config/systemd/user/snixembed.service" = "~/dotfiles/systemd/user/snixembed.service"
"~/.config/systemd/user/obsbot-enforce.service" = "~/dotfiles/systemd/user/obsbot-enforce.service"
# Global agent instructions: one source, linked per tool
"~/.claude/CLAUDE.md" = "~/dotfiles/AGENTS.md"
"~/.codex/AGENTS.md" = "~/dotfiles/AGENTS.md"
"~/.gemini/GEMINI.md" = "~/dotfiles/AGENTS.md"
"~/.config/opencode/AGENTS.md" = "~/dotfiles/AGENTS.md"

# --- System services ----------------------------------------------------------
[bootstrap.services.NetworkManager]
[bootstrap.services.lightdm]
[bootstrap.services.docker]
[bootstrap.services.postgresql]
[bootstrap.services.earlyoom]
[bootstrap.services.cups]
[bootstrap.services.tailscaled]
[bootstrap.services.sshd]
[bootstrap.services.lm_sensors]
# Snapshots (snapper config is created by bin/setup-snapper in post-packages)
[bootstrap.services."snapper-timeline.timer"]
[bootstrap.services."snapper-cleanup.timer"]
[bootstrap.services.grub-btrfsd]
# Weekly package cache cleanup and mirror refresh
[bootstrap.services."paccache.timer"]
[bootstrap.services."reflector.timer"]

# --- Hooks (commands mise can't declare) ---------------------------------------
[bootstrap.hooks]
# Install the tmux plugins listed in .tmux.conf.
post-repos = "~/.tmux/plugins/tpm/bin/install_plugins"
post-dotfiles = "systemctl --user daemon-reload && systemctl --user enable --now brave-sessions.timer obsbot-enforce.service"

[bootstrap.hooks.post-packages]
run = [
  # postgresql won't start until its data directory is initialized.
  "[ -d /var/lib/postgres/data/base ] || sudo -iu postgres initdb -D /var/lib/postgres/data",
  "~/dotfiles/bin/setup-snapper",
]

[bootstrap.hooks.post-tools]
run = [
  "npx -y skills add coreyhaines31/marketingskills --global --all -y",
  "npx -y skills add mager/frontend-design --global --all -y",
  "npx -y skills add JuliusBrussee/caveman --global --all -y",
]
