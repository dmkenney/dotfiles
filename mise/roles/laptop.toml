# Role: laptop. Linked as ~/.config/mise/conf.d/role-laptop.toml on machines whose
# file in mise/machines/ has "laptop" in its "# roles:" line (omarchy/setup.sh links it).
#
# Put laptop-only things here: packages, services, and plugins or themes moved out of
# mise/addons.toml (sync-addons leaves an add-on alone once any file declares it).
#
# [bootstrap.packages]
# "pacman:tlp" = "latest"
#
# [bootstrap.repos]
# "~/.config/omarchy/plugins/<id>" = { url = "https://github.com/<owner>/<repo>.git" }

[bootstrap.packages]
# Accelerometer for auto-rotate (2-in-1s).
"pacman:iio-sensor-proxy" = "latest"
# Switches the NVIDIA GPU off and on (Integrated / Hybrid); dylan.gpu bar widget.
"pacman:supergfxctl" = "latest"

[bootstrap.services.supergfxd]

[bootstrap.files."/etc/udev/rules.d/61-igpu.rules"]
source = "~/dotfiles/omarchy/laptop/61-igpu.rules"
owner = "root"
group = "root"
mode = "0644"

[dotfiles]
"~/.local/bin/auto-rotate" = "~/dotfiles/bin/auto-rotate"
"~/.local/bin/gpu-mode" = "~/dotfiles/bin/gpu-mode"
"~/.config/uwsm/env-hyprland" = "~/dotfiles/omarchy/laptop/env-hyprland"

# Rotate the panel, touchscreen and pen with the screen. Stop it with
# `systemctl --user stop dev.mise.auto-rotate` to hold the current orientation.
[bootstrap.linux.systemd.units.auto-rotate]
description = "Rotate the laptop panel to follow the accelerometer"
exec_start = "%h/.local/bin/auto-rotate"
part_of = ["graphical-session.target"]
after = ["graphical-session.target"]
wanted_by = ["graphical-session.target"]
restart = "on-failure"
restart_sec = "5"
