# Turn the monitors off after 10 idle minutes. Omarchy's shell only runs the
# screensaver (idle.screensaver, 150s) and lock (idle.lock, 300s) and never powers
# the displays down. Any key or mouse movement turns them back on (Omarchy sets
# misc.key_press_enables_dpms / mouse_move_enables_dpms).
# Skipped while Omarchy's stay-awake toggle (Super+Ctrl+I) is on. Idle inhibitors,
# such as a playing video, hold it off as they do Omarchy's idle.

general {
  after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
  timeout = 600
  on-timeout = [ -f ~/.local/state/omarchy/indicators/stay-awake ] || hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
  on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}
