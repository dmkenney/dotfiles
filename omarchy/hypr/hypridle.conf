# Turn the monitors off after 10 idle minutes. Omarchy's shell only runs the
# screensaver (idle.screensaver, 150s) and lock (idle.lock, 300s) and never powers
# the displays down. Any key or mouse movement turns them back on (Omarchy sets
# misc.key_press_enables_dpms / mouse_move_enables_dpms).
# Skipped while Omarchy's stay-awake toggle (Super+Ctrl+I) is on. A playing video
# still holds it off: Chromium browsers ask over D-Bus (org.freedesktop.ScreenSaver,
# "Video Wake Lock"), which hypridle honors.
#
# Wayland idle inhibitors are ignored because Chromium 146+ (Brave 1.9x) leaves a
# zwp_idle_inhibitor on an ordinary window with no media playing, so the display
# never turned off (basecamp/omarchy#5092, 2026-10-22). Real wake locks still
# arrive over D-Bus, so nothing is lost for Chromium. Native Wayland apps that only
# use the protocol (mpv, Firefox) no longer hold the display on.
# ROLLBACK: remove ignore_wayland_inhibit once Brave ships Chromium 157 or later
# (Chrome 157 stable is 2026-11-03; the fix is crbug 570067499, commit 4dd9a00).
# Check with `brave --version` and `pacman -Q brave-bin`.

general {
  after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
  ignore_wayland_inhibit = true
}

listener {
  timeout = 600
  on-timeout = [ -f ~/.local/state/omarchy/indicators/stay-awake ] || hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
  on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# Laptops on battery: suspend after 15 idle minutes (the desktop has no battery, so
# this never fires there). Omarchy's sleep hook locks the screen first.
listener {
  timeout = 900
  on-timeout = [ -f ~/.local/state/omarchy/indicators/stay-awake ] || ! grep -qs Discharging /sys/class/power_supply/BAT*/status || systemctl suspend
}
