set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -s escape-time 0

# OSC 52 clipboard: copies land in the terminal-side clipboard (works over ssh)
set -s set-clipboard on
set -as terminal-features ',*:clipboard'

unbind r
# i3 links this file as ~/.tmux.conf, Omarchy as ~/.config/tmux/tmux.conf.
bind r source-file -q ~/.tmux.conf \; source-file -q ~/.config/tmux/tmux.conf

unbind C-b
set -g prefix C-Space

set -g base-index 1
set -g pane-base-index 1
set-option -g status-position top
set -g mouse on

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel

# Open panes in current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Increase scrollback buffer size from 2000 to 50000 lines
set -g history-limit 50000

# Increase tmux messages display duration from 750ms to 4s
set -g display-time 4000

# Vim like keybindings.
bind-key j select-pane -D
bind-key h select-pane -L
bind-key k select-pane -U
bind-key l select-pane -R

# Resize panes.
bind-key C-j resize-pane -D 5
bind-key C-h resize-pane -L 5
bind-key C-k resize-pane -U 5
bind-key C-l resize-pane -R 5

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin "jimeh/tmuxifier"
set -g @plugin 'tmux-plugins/tmux-resurrect'

# tmux-resurrect config options.
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-processes 'btop ssh psql sqlite3 npm java'


###########################################################################
# Colors: terminal color names, not hex, so the bar follows the terminal
# theme (Omarchy theme switching, same approach as Omarchy's tmux.conf).
###########################################################################
set -g mode-style "bg=blue,fg=black"
set -g message-style "bg=default,fg=blue"
set -g message-command-style "bg=default,fg=blue"

set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"

set -g status "on"
set -g status-justify "left"

set -g status-style "bg=default,fg=default"

set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "#[fg=black,bg=blue,bold] #S #[bg=default,nobold] "
set -g status-right "#{prefix_highlight} #[fg=brightblack]%Y-%m-%d  %I:%M %p #[fg=black,bg=blue,bold] #h "
if-shell '[ "$(tmux show-option -gqv "clock-mode-style")" == "24" ]' {
  set -g status-right "#{prefix_highlight} #[fg=brightblack]%Y-%m-%d  %H:%M #[fg=black,bg=blue,bold] #h "
}

setw -g window-status-activity-style "underscore,fg=white,bg=default"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=brightblack,bg=default"
setw -g window-status-format "#[fg=brightblack] #I  #W #F "
setw -g window-status-current-format "#[fg=blue,bold] #I  #W #F "
setw -g clock-mode-colour blue

# tmux-plugins/tmux-prefix-highlight support
set -g @prefix_highlight_fg "black"
set -g @prefix_highlight_bg "yellow"
###########################################################################

# Plugins live in ~/.tmux/plugins on every machine (mise clones tpm there; .zshrc puts
# tmuxifier on PATH from there). Without this, tpm uses ~/.config/tmux/plugins
# when the config is linked as ~/.config/tmux/tmux.conf (Omarchy).
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
